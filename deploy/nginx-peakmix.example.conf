# PeakMix Nginx 反向代理示例（腾讯云轻量 / Linux）
# 使用前请将 server_name、SSL 证书路径、root 等替换为实际值。
#
# 假设：
# - Next.js 生产构建静态/Node 监听 127.0.0.1:3000（npm run start）
# - Express API 监听 127.0.0.1:4000

upstream peakmix_web {
    server 127.0.0.1:3000;
}

upstream peakmix_api {
    server 127.0.0.1:4000;
}

server {
    listen 80;
    server_name your-domain.com;

    # 如已配置 HTTPS，可将 80 重定向到 443
    # return 301 https://$host$request_uri;

    client_max_body_size 100m;

    # API 转发到 Express（与代码中前缀 /api/v1 一致）
    location /api/ {
        proxy_pass http://peakmix_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端 Next.js
    location / {
        proxy_pass http://peakmix_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
